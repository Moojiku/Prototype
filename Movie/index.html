<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KapanLagi Movie · Prototype</title>
  <style>
    html,body{margin:0;min-height:100%;font:14px Arial,sans-serif;color:#333}
    #loading{padding:28px;max-width:680px;margin:10vh auto;line-height:1.6}
    #loading strong{display:block;font-size:18px;margin-bottom:8px}
  </style>
</head>
<body>
  <div id="loading"><strong>Memuat KapanLagi Movie Prototype…</strong>Mohon tunggu sebentar.</div>
  <script>
  (async function(){
    try {
      if (!('DecompressionStream' in window)) throw new Error('Browser belum mendukung decompression gzip. Gunakan Chrome atau Edge versi terbaru.');
      const files = ['app-01.gzpart','app-02.gzpart','app-03.gzpart','app-04.gzpart','app-05.gzpart','app-06.gzpart','app-07.gzpart','app-08.gzpart','app-09.gzpart'];
      const parts = await Promise.all(files.map(async name => {
        const response = await fetch('./payload/' + name, {cache:'no-store'});
        if (!response.ok) throw new Error('File ' + name + ' gagal dimuat (HTTP ' + response.status + ').');
        return new Uint8Array(await response.arrayBuffer());
      }));
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const compressed = new Uint8Array(total);
      let offset = 0;
      for (const part of parts) { compressed.set(part, offset); offset += part.length; }
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      document.open(); document.write(html); document.close();
    } catch (error) {
      document.getElementById('loading').innerHTML = '<strong>Prototype belum dapat dimuat</strong>' + String(error.message || error) + '<p>Pastikan seluruh file di folder Movie sudah terunggah, lalu refresh halaman.</p>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
